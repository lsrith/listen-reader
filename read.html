<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reading</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <p class="note" id="note" hidden></p>
    <article id="text"></article>
    <footer class="end" id="end"></footer>
  </main>

  <div class="tip" id="tip" role="toolbar" hidden>
    <button class="icon" id="speakHere" aria-label="Read aloud from here" title="Read aloud from here"><svg><use href="icons.svg#i-listen"/></svg></button>
    <button class="icon" id="startHere" aria-label="Start page here" title="Start page here"><svg><use href="icons.svg#i-page"/></svg></button>
  </div>

  <nav class="dock" id="dock">
    <div class="dock-row" id="navRow">
      <a class="icon" href="./" aria-label="Library"><svg><use href="icons.svg#i-library"/></svg></a>
      <a class="icon" id="chapters" aria-label="Chapters"><svg><use href="icons.svg#i-list"/></svg></a>
      <a class="icon" id="prevPage" aria-label="Previous page"><svg><use href="icons.svg#i-back"/></svg></a>
      <a class="icon" id="nextPage" aria-label="Next page"><svg><use href="icons.svg#i-forward"/></svg></a>
      <label class="icon wide" aria-label="Chapters per page" title="Chapters per page">
        <svg><use href="icons.svg#i-pages"/></svg><span id="perPageValue"></span>
        <select id="perPage" class="overlay">
          <option>1</option><option>2</option><option>3</option><option>5</option>
          <option>8</option><option>10</option><option>15</option><option>20</option>
        </select>
      </label>
      <button class="icon" id="listen" aria-label="Read aloud"><svg><use href="icons.svg#i-listen"/></svg></button>
    </div>
    <div class="dock-row" id="voiceRow" hidden>
      <button class="icon" id="vPrev" aria-label="Previous paragraph"><svg><use href="icons.svg#i-prev"/></svg></button>
      <button class="icon play" id="vPlay" aria-label="Pause"><svg><use href="icons.svg#i-pause"/></svg></button>
      <button class="icon" id="vNext" aria-label="Next paragraph"><svg><use href="icons.svg#i-next"/></svg></button>
      <button class="icon" id="vClose" aria-label="Stop reading aloud"><svg><use href="icons.svg#i-close"/></svg></button>
    </div>
  </nav>
  <script type="module" src="read.js"></script>
</body>
</html>
