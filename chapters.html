<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chapters</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1 id="title">Chapters</h1>
      <p class="sub" id="count"></p>
    </header>
    <ul id="toc" class="toc"></ul>
  </main>

  <nav class="dock">
    <div class="dock-row">
      <a class="icon" href="./" aria-label="Library" title="Library"><svg><use href="icons.svg#i-library"/></svg></a>
      <a class="icon" id="resume" aria-label="Continue reading" title="Continue reading"><svg><use href="icons.svg#i-open"/></svg></a>
      <button class="icon" id="locate" aria-label="Show current chapter" title="Show current chapter"><svg><use href="icons.svg#i-locate"/></svg></button>
    </div>
  </nav>
  <script type="module" src="chapters.js"></script>
</body>
</html>
